[project]
name = "pixi-bot"
version = "1.5.0"
description = "A modular and multiplatform AI chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1", "dotenv>=0.9", "zstandard>=0.25"]

[project.scripts]
pixi-cli = "pixi.cli:main"
pixi-bot = "pixi.cli:main"

[project.optional-dependencies]
kiwix = [
  # Archive enumeration uses the indexed-entry API in these releases.
  "libzim>=3.7.0,<3.14",
]
sql = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]
redis = [
  "redis>=5.0",
]
media = [
  "av>=16.0",
]
telegram = [
  "python-telegram-bot>=22.0",
]
discord = ["discord-py>=2.6"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
namespace-packages = ["src/pixi"]

[tool.ruff.lint]
select = ["I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
  "pre-commit>=4.7.0",
  "pyright>=1.1.414",
  "ruff>=0.17.2",
]
