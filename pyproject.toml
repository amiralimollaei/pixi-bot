[project]
name = "pixi-bot"
version = "1.5.0"
description = "A modular and multiplatform AI chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9",
    "zstandard>=0.25"
]

[tool.uv]
package = true

[project.scripts]
pixi-cli = "pixi.cli:main"
pixi-bot = "pixi.cli:main"

[project.optional-dependencies]
sql = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]
redis = [
    "redis>=5.0",
]
media = [
    "av>=16.0",
]
telegram = [
    "python-telegram-bot>=22.0",
]
discord = [
    "discord-py>=2.6"
]


[tool.setuptools.packages.find]
where = ["src"]

